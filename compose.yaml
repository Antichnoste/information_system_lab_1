name: lab-1
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bd
      POSTGRES_USER: me
      POSTGRES_PASSWORD: secret
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U me -d bd"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
volumes:
  pgdata:
