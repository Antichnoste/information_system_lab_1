name: lab-1
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: humanity
      POSTGRES_USER: humanity
      POSTGRES_PASSWORD: humanity-local
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/humanity
      DB_USER: humanity
      DB_PASSWORD: humanity-local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
volumes:
  pgdata:
