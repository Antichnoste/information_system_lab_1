plugins { id 'java'; id 'war' }
group = 'org.example'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }
configurations { jdbcDriver }
dependencies {
    providedCompile 'jakarta.platform:jakarta.jakartaee-api:10.0.0'
    compileOnly('org.hibernate.orm:hibernate-core:6.6.3.Final') { transitive = false }
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'org.mindrot:jbcrypt:0.4'
    jdbcDriver('org.postgresql:postgresql:42.7.5') { transitive = false }
}

sourceSets.main.resources.exclude 'static/**'

war {
    archiveFileName = 'ROOT.war'
    from('src/main/resources/static')
}
def heliosUser = providers.gradleProperty('heliosUser').orElse('s466113')
def heliosHost = providers.gradleProperty('heliosHost').orElse('se.ifmo.ru')
def heliosPort = providers.gradleProperty('heliosPort').orElse('2222')
def heliosHome = providers.gradleProperty('heliosHome').orElse('/home/studs/s466113')
def wildflyHome = providers.gradleProperty('wildflyHome').orElse('/home/studs/s466113/wildfly-35.0.1.Final')

tasks.register('deployHelios') {
    dependsOn 'assemble'
    doLast {
        def run = { List<String> command ->
            def execution = providers.exec {
                commandLine command
                ignoreExitValue = true
            }
            def result = execution.result.get()
            def output = execution.standardOutput.asText.get()
            def errors = execution.standardError.asText.get()
            if (!output.isEmpty()) logger.lifecycle(output.stripTrailing())
            if (!errors.isEmpty()) logger.error(errors.stripTrailing())
            if (result.exitValue != 0) {
                throw new GradleException("Command failed with exit code ${result.exitValue}: ${command.join(' ')}")
            }
        }
        def target = "${heliosUser.get()}@${heliosHost.get()}"
        def war = layout.buildDirectory.file('libs/ROOT.war').get().asFile
        def remoteWar = "${heliosHome.get()}/ROOT.war.new"
        def deployment = "${wildflyHome.get()}/standalone/deployments"

        def connectionOptions = ['-o', 'ConnectTimeout=15', '-o', 'ConnectionAttempts=3',
                                 '-o', 'ServerAliveInterval=15', '-o', 'ServerAliveCountMax=3']
        logger.lifecycle('Загрузка WAR на Helios...')
        run(['scp'] + connectionOptions + ['-P', heliosPort.get(), war.absolutePath, "${target}:${remoteWar}"])
        logger.lifecycle('Установка WAR в WildFly...')
        run(['ssh'] + connectionOptions + ['-p', heliosPort.get(), target,
            "set -e; mv -f '${remoteWar}' '${deployment}/ROOT.war'; rm -f '${deployment}/ROOT.war.failed'; ls -lh '${deployment}/ROOT.war'"])
    }
}
